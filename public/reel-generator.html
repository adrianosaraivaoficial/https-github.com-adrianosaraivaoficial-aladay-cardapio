<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerador de reels Aladay</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #e2e8f0; font: 16px system-ui, sans-serif; color: #0f172a; }
      main { max-width: 720px; margin: 0 auto; padding: 32px; }
      button { border: 0; border-radius: 8px; padding: 12px 18px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { margin: 16px 0; white-space: pre-wrap; }
      a { display: block; margin: 10px 0; color: #1d4ed8; font-weight: 700; }
      canvas { display: block; width: 270px; height: 480px; margin-top: 18px; border-radius: 12px; box-shadow: 0 12px 30px rgba(15, 23, 42, .18); }
    </style>
  </head>
  <body>
    <main>
      <h1>Gerador de reels Aladay</h1>
      <p>Gera vídeos WebM verticais usando as capturas reais da página inicial.</p>
      <button id="generate">Gerar quatro reels</button>
      <div id="status">Aguardando.</div>
      <div id="links"></div>
      <canvas id="canvas" width="540" height="960" aria-label="Prévia do reel"></canvas>
    </main>
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');
      const links = document.getElementById('links');
      const button = document.getElementById('generate');
      const W = canvas.width;
      const H = canvas.height;
      const FPS = 30;
      const reels = [
        { id: 'aladay-reel-cardapio', file: 'aladay-cardapio.webp', title: 'Seu cardápio.\nNa mão do cliente.', subtitle: 'Acesso rápido por QR Code.', tag: 'CARDÁPIO DIGITAL', accent: '#38bdf8' },
        { id: 'aladay-reel-carrinho', file: 'aladay-carrinho.webp', title: 'Escolha. Adicione.\nPeça.', subtitle: 'Uma jornada simples do produto ao carrinho.', tag: 'PEDIDO SEM ATRITO', accent: '#60a5fa' },
        { id: 'aladay-reel-whatsapp', file: 'aladay-whatsapp.webp', title: 'Pedido atualizado\nno WhatsApp.', subtitle: 'Mais clareza para o cliente, menos mensagens soltas.', tag: 'ATENDIMENTO', accent: '#34d399' },
        { id: 'aladay-reel-painel', file: 'aladay-painel.webp', title: 'Controle a operação\nem um só painel.', subtitle: 'Pedidos, produtos e rotina do restaurante.', tag: 'GESTÃO ALADAY', accent: '#818cf8' },
      ];
      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = '/public/assets/landing/' + file;
        });
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function drawWrapped(text, x, y, maxWidth, lineHeight, font) {
        ctx.font = font;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        const lines = text.split('\n');
        lines.forEach((line, index) => ctx.fillText(line, x, y + index * lineHeight, maxWidth));
      }

      function drawCover(image, x, y, w, h, scale = 1, offsetY = 0) {
        const sourceRatio = image.width / image.height;
        const targetRatio = w / h;
        let sw = image.width;
        let sh = image.height;
        if (sourceRatio > targetRatio) sw = image.height * targetRatio;
        else sh = image.width / targetRatio;
        sw /= scale;
        sh /= scale;
        const sx = (image.width - sw) / 2;
        const sy = Math.max(0, Math.min(image.height - sh, (image.height - sh) / 2 + offsetY * image.height));
        ctx.drawImage(image, sx, sy, sw, sh, x, y, w, h);
      }

      function drawScene(image, reel, t) {
        const progress = Math.min(1, t / 6);
        const intro = Math.min(1, t / 1.1);
        const outro = Math.max(0, (t - 5.25) / .75);
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#020617');
        bg.addColorStop(1, '#0f172a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = .18;
        ctx.fillStyle = reel.accent;
        ctx.beginPath();
        ctx.arc(475, 140, 210 + progress * 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = reel.accent;
        ctx.fillRect(42, 68, 44, 5);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '700 16px Arial, sans-serif';
        ctx.textBaseline = 'top';
        ctx.fillText(reel.tag, 42, 91);

        ctx.save();
        ctx.globalAlpha = intro;
        ctx.translate(0, (1 - intro) * 24);
        ctx.fillStyle = '#ffffff';
        drawWrapped(reel.title, 42, 138, 465, 48, '800 39px Arial, sans-serif');
        ctx.fillStyle = '#cbd5e1';
        drawWrapped(reel.subtitle, 42, 246, 445, 25, '400 20px Arial, sans-serif');
        ctx.restore();

        const imageY = 350 - Math.sin(progress * Math.PI) * 18;
        const isPanel = reel.id.includes('painel');
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, .55)';
        ctx.shadowBlur = 34;
        ctx.shadowOffsetY = 18;
        ctx.fillStyle = '#0b1220';
        roundRect(28, imageY - 12, 484, isPanel ? 400 : 560, 28);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.clip();
        if (isPanel) drawCover(image, 36, imageY - 4, 468, 380, 1.03, Math.sin(progress * Math.PI) * .06);
        else drawCover(image, 52, imageY, 436, 536, 1.06 + progress * .07, Math.sin(progress * Math.PI) * .08);
        ctx.restore();

        ctx.fillStyle = '#ffffff';
        ctx.font = '700 15px Arial, sans-serif';
        ctx.textBaseline = 'top';
        ctx.fillText('ALADAY', 42, 900);
        ctx.fillStyle = reel.accent;
        ctx.fillRect(42, 928, 456 * Math.max(.08, 1 - outro), 4);
        ctx.globalAlpha = 1 - outro;
        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 14px Arial, sans-serif';
        ctx.fillText('Cardápio digital para restaurantes', 42, 943);
        ctx.globalAlpha = 1;
      }

      async function recordReel(reel) {
        const image = await loadImage(reel.file);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
        const stream = canvas.captureStream(FPS);
        const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 3_500_000 });
        const chunks = [];
        recorder.ondataavailable = (event) => event.data.size && chunks.push(event.data);
        const finished = new Promise((resolve) => { recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' })); });
        recorder.start();
        const start = performance.now();
        await new Promise((resolve) => {
          function frame(now) {
            const t = (now - start) / 1000;
            drawScene(image, reel, Math.min(t, 6));
            if (t < 6) requestAnimationFrame(frame);
            else { setTimeout(() => recorder.stop(), 120); resolve(); }
          }
          requestAnimationFrame(frame);
        });
        const blob = await finished;
        stream.getTracks().forEach((track) => track.stop());
        return blob;
      }

      button.addEventListener('click', async () => {
        button.disabled = true;
        links.innerHTML = '';
        for (const reel of reels) {
          status.textContent = 'Gerando ' + reel.id + '...';
          const blob = await recordReel(reel);
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = reel.id + '.webm';
          link.textContent = 'Baixar ' + reel.id + '.webm (' + Math.round(blob.size / 1024) + ' KB)';
          links.append(link);
        }
        status.textContent = 'Quatro reels prontos. Use os links acima para baixar os arquivos.';
        button.disabled = false;
      });
    </script>
  </body>
</html>
